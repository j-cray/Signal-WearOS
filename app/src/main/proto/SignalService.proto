syntax = "proto2";

package signalservice;

option java_package = "org.whispersystems.signalservice.internal.push";
option java_outer_classname = "SignalServiceProtos";

message Envelope {
  enum Type {
    UNKNOWN = 0;
    CIPHERTEXT = 1;
    KEY_EXCHANGE = 2;
    PREKEY_BUNDLE = 3;
    RECEIPT = 5;
    UNIDENTIFIED_SENDER = 6;
  }

  optional Type type = 1;
  optional string source = 2;
  optional uint32 sourceDevice = 3;
  optional string relay = 4;
  optional uint64 timestamp = 5;
  optional bytes legacyMessage = 6; // Contains an encrypted DataMessage
  optional bytes content = 7; // Contains an encrypted Content
  optional string serverGuid = 8;
  optional uint64 serverTimestamp = 9;
  optional string sourceUuid = 11;
}

message Content {
  optional DataMessage dataMessage = 1;
  optional SyncMessage syncMessage = 2;
  optional CallMessage callMessage = 3;
  optional NullMessage nullMessage = 4;
  optional ReceiptMessage receiptMessage = 5;
  optional TypingMessage typingMessage = 6;
  optional bytes senderKeyDistributionMessage = 7;
  optional DecryptionErrorMessage decryptionErrorMessage = 8;
}

message DataMessage {
  enum Flags {
    END_SESSION = 1;
    EXPIRATION_TIMER_UPDATE = 2;
    PROFILE_KEY_UPDATE = 4;
  }

  optional string body = 1;
  repeated AttachmentPointer attachments = 2;
  optional GroupContext group = 3;
  optional uint32 flags = 4;
  optional uint32 expireTimer = 5;
  optional bytes profileKey = 6;
  optional uint64 timestamp = 7;
  optional Quote quote = 8;
  repeated Contact contact = 9;
  repeated Preview preview = 10;
  optional Sticker sticker = 11;
  optional bool viewOnce = 12;
  optional Reaction reaction = 13;
  optional Delete delete = 14;
  optional BodyRange bodyRanges = 15;
  optional GroupCallUpdate groupCallUpdate = 16;
  optional Payment payment = 17;
  optional GiftBadge giftBadge = 18;
}

message AttachmentPointer {
  enum Flags {
    VOICE_MESSAGE = 1;
  }

  optional fixed64 id = 1;
  optional string contentType = 2;
  optional bytes key = 3;
  optional uint32 size = 4;
  optional bytes thumbnail = 5;
  optional bytes digest = 6;
  optional string fileName = 7;
  optional uint32 flags = 8;
  optional uint32 width = 9;
  optional uint32 height = 10;
  optional string caption = 11;
  optional string blurHash = 12;
  optional uint64 uploadTimestamp = 13;
  optional string cdnNumber = 14;
}

message GroupContext {
  enum Type {
    UNKNOWN = 0;
    DELIVER = 1;
    UPDATE = 2;
    QUIT = 3;
    REQUEST_INFO = 4;
  }

  optional bytes id = 1;
  optional Type type = 2;
  optional string name = 3;
  repeated string members = 4;
  optional AttachmentPointer avatar = 5;
}

message SyncMessage {
  optional Sent sent = 1;
  optional Contacts contacts = 2;
  optional Groups groups = 3;
  optional Request request = 4;
  repeated Read read = 5;
  optional Blocked blocked = 6;
  optional Verified verified = 7;
  optional Configuration configuration = 8;
  optional bytes padding = 9;
  repeated StickerPackOperation stickerPackOperation = 10;
  optional ViewOnceOpen viewOnceOpen = 11;
  optional FetchLatest fetchLatest = 12;
  optional Keys keys = 13;
  optional MessageRequestResponse messageRequestResponse = 14;
  optional OutgoingPayment outgoingPayment = 15;
  optional ViewOnceOpen syncViewOnceOpen = 16;
  optional PniChange pniChange = 17;

  message Sent {
    optional string destination = 1;
    optional uint64 timestamp = 2;
    optional DataMessage message = 3;
    optional uint64 expirationStartTimestamp = 4;
    optional UnidentifiedStatus unidentifiedStatus = 5;
    optional bool isRecipientUpdate = 6;
    optional string destinationUuid = 7;
    optional StoryMessage storyMessage = 8;
  }

  message Contacts {
    optional AttachmentPointer blob = 1;
    optional bool complete = 2;
  }

  message Groups {
    optional AttachmentPointer blob = 1;
  }

  message Request {
    enum Type {
      UNKNOWN = 0;
      CONTACTS = 1;
      GROUPS = 2;
      BLOCKED = 3;
      CONFIGURATION = 4;
      KEYS = 5;
      PNI = 6;
    }
    optional Type type = 1;
  }

  message Read {
    optional string sender = 1;
    optional uint64 timestamp = 2;
    optional string senderUuid = 3;
  }

  message Blocked {
    repeated string numbers = 1;
    repeated string uuids = 2;
    repeated bytes groupIds = 3;
  }

  message Verified {
    enum State {
      DEFAULT = 0;
      VERIFIED = 1;
      UNVERIFIED = 2;
    }
    optional string destination = 1;
    optional bytes identityKey = 2;
    optional State state = 3;
    optional bytes nullMessage = 4;
    optional string destinationUuid = 5;
  }

  message Configuration {
    optional bool readReceipts = 1;
    optional bool unidentifiedDeliveryIndicators = 2;
    optional bool typingIndicators = 3;
    optional bool linkPreviews = 4;
  }

  message StickerPackOperation {
    enum Type {
      INSTALL = 1;
      REMOVE = 2;
    }
    optional bytes packId = 1;
    optional bytes packKey = 2;
    optional Type type = 3;
  }

  message ViewOnceOpen {
    optional string sender = 1;
    optional uint64 timestamp = 2;
    optional string senderUuid = 3;
  }

  message FetchLatest {
    enum Type {
      UNKNOWN = 0;
      LOCAL_PROFILE = 1;
      STORAGE_MANIFEST = 2;
      SUBSCRIPTION_STATUS = 3;
    }
    optional Type type = 1;
  }

  message Keys {
    optional bytes storageService = 1;
  }

  message MessageRequestResponse {
    enum Type {
      UNKNOWN = 0;
      ACCEPT = 1;
      DELETE = 2;
      BLOCK = 3;
      BLOCK_AND_DELETE = 4;
    }
    optional string threadE164 = 1;
    optional string threadUuid = 2;
    optional bytes groupId = 3;
    optional Type type = 4;
  }

  message OutgoingPayment {
    optional string recipient = 1;
    optional uint64 timestamp = 2;
    optional bytes note = 3;
    optional Payment payment = 4;
  }

  message UnidentifiedStatus {
    optional bytes destinationIdentityKey = 1;
    optional bool unidentified = 2;
  }

  message PniChange {
    optional bytes pni = 1;
  }
}

message CallMessage {
  optional Offer offer = 1;
  optional Answer answer = 2;
  optional IceUpdate iceUpdate = 3;
  optional Busy busy = 4;
  optional Hangup hangup = 5;
  optional Opaque opaque = 6;

  message Offer {
    optional uint64 id = 1;
    optional string description = 2;
    enum Type {
      OFFER_AUDIO_CALL = 0;
      OFFER_VIDEO_CALL = 1;
    }
    optional Type type = 3;
    optional bytes opaque = 4;
  }

  message Answer {
    optional uint64 id = 1;
    optional string description = 2;
    optional bytes opaque = 3;
  }

  message IceUpdate {
    optional uint64 id = 1;
    optional string sdp = 2;
    optional bytes opaque = 3;
  }

  message Busy {
    optional uint64 id = 1;
  }

  message Hangup {
    optional uint64 id = 1;
    optional uint32 deviceId = 2;
    enum Type {
      HANGUP_NORMAL = 0;
      HANGUP_ACCEPTED = 1;
      HANGUP_DECLINED = 2;
      HANGUP_BUSY = 3;
      HANGUP_NEED_PERMISSION = 4;
    }
    optional Type type = 3;
    optional bool legacy = 4;
  }

  message Opaque {
    optional bytes data = 1;
    optional bytes urgency = 2;
  }
}

message NullMessage {
  optional bytes padding = 1;
}

message ReceiptMessage {
  enum Type {
    DELIVERY = 0;
    READ = 1;
    VIEWED = 2;
  }
  optional Type type = 1;
  repeated uint64 timestamp = 2;
}

message TypingMessage {
  enum Action {
    STARTED = 0;
    STOPPED = 1;
  }
  optional uint64 timestamp = 1;
  optional Action action = 2;
  optional bytes groupId = 3;
}

message DecryptionErrorMessage {
  optional bytes ratchetKey = 1;
  optional uint64 timestamp = 2;
  optional uint32 deviceId = 3;
}

message Quote {
  optional uint64 id = 1;
  optional string author = 2;
  optional string text = 3;
  repeated QuotedAttachment attachments = 4;
  optional string authorUuid = 5;

  message QuotedAttachment {
    optional string contentType = 1;
    optional string fileName = 2;
    optional AttachmentPointer thumbnail = 3;
  }
}

message Contact {
  optional string name = 1;
  optional string number = 2;
  optional string email = 3;
  optional AttachmentPointer avatar = 4;
  optional string organization = 5;
  optional string uuid = 6;
}

message Preview {
  optional string url = 1;
  optional string title = 2;
  optional AttachmentPointer image = 3;
  optional string description = 4;
  optional uint64 date = 5;
}

message Sticker {
  optional bytes packId = 1;
  optional bytes packKey = 2;
  optional uint32 stickerId = 3;
  optional AttachmentPointer data = 4;
  optional string emoji = 5;
}

message Reaction {
  optional string emoji = 1;
  optional bool remove = 2;
  optional string targetAuthor = 3;
  optional uint64 targetSentTimestamp = 4;
  optional string targetAuthorUuid = 5;
}

message Delete {
  optional uint64 targetSentTimestamp = 1;
}

message BodyRange {
  optional uint32 start = 1;
  optional uint32 length = 2;
  enum Style {
    NONE = 0;
    BOLD = 1;
    ITALIC = 2;
    SPOILER = 3;
    STRIKETHROUGH = 4;
    MONOSPACE = 5;
  }
  optional Style style = 3;
  optional string mentionUuid = 4;
}

message GroupCallUpdate {
  optional bytes eraId = 1;
}

message Payment {
  optional Notification notification = 1;
  optional Activation activation = 2;

  message Notification {
    optional bytes note = 1;
    optional Transaction transaction = 2;

    message Transaction {
      optional bytes mobileCoin = 1;
    }
  }

  message Activation {
    enum Type {
      REQUEST = 0;
      ACTIVATED = 1;
    }
    optional Type type = 1;
  }
}

message GiftBadge {
  optional bytes receiptCredentialPresentation = 1;
}

message StoryMessage {
  optional AttachmentPointer file = 1;
  optional TextAttachment text = 2;
  optional bool allowReplies = 3;

  message TextAttachment {
    optional string text = 1;
    optional Style style = 2;
    optional string textBackgroundColor = 3;
    optional string textForegroundColor = 4;
    optional Preview preview = 5;
    optional string backgroundColor = 6;

    message Style {
      enum Type {
        DEFAULT = 0;
        REGULAR = 1;
        BOLD = 2;
        SERIF = 3;
        SCRIPT = 4;
        CONDENSED = 5;
      }
      optional Type type = 1;
    }
  }
}

message WebSocketRequestMessage {
  optional string verb = 1;
  optional string path = 2;
  optional bytes body = 3;
  repeated string headers = 5;
  optional uint64 id = 4;
}

message WebSocketResponseMessage {
  optional uint64 id = 1;
  optional uint32 status = 2;
  optional string message = 3;
  repeated string headers = 5;
  optional bytes body = 4;
}

message WebSocketMessage {
  enum Type {
    UNKNOWN = 0;
    REQUEST = 1;
    RESPONSE = 2;
  }
  optional Type type = 1;
  optional WebSocketRequestMessage request = 2;
  optional WebSocketResponseMessage response = 3;
}

message ProvisioningMessage {
  optional bytes publicKey = 1;
  optional bytes body = 2;
  optional string provisioningCode = 3;
  optional string provisioningVersion = 4;
  optional bytes profileKey = 5;
  optional bool readReceipts = 6;
  optional string userAgent = 7;
  optional string uuid = 8;
  optional string number = 9;
  optional string provisioningUrl = 10;
}
