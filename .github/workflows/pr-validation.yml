name: PR Validation

on:
  pull_request:
    branches: [ main, develop ]
    types: [opened, synchronize, reopened]

jobs:
  validate:
    name: Validate Pull Request
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
        
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'
          
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: wrapper
          
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
        
      - name: Check code formatting
        run: ./gradlew ktlintCheck --no-daemon || echo "ktlint not configured"
        continue-on-error: true
        
      - name: Run static analysis
        run: ./gradlew lint --no-daemon
        continue-on-error: true
        
      - name: Build and test
        run: |
          ./gradlew assembleDebug --no-daemon
          ./gradlew test --no-daemon
        continue-on-error: true
        
      - name: PR Validation Summary
        if: always()
        run: |
          echo "## Pull Request Validation" >> $GITHUB_STEP_SUMMARY
          echo "### PR Information" >> $GITHUB_STEP_SUMMARY
          echo "- **PR Number:** #${{ github.event.pull_request.number }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Title:** ${{ github.event.pull_request.title }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Author:** ${{ github.event.pull_request.user.login }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Base Branch:** ${{ github.event.pull_request.base.ref }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Head Branch:** ${{ github.event.pull_request.head.ref }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Validation Status" >> $GITHUB_STEP_SUMMARY
          echo "All validation checks completed!" >> $GITHUB_STEP_SUMMARY
