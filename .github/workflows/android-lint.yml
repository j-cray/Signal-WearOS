name: Android Lint

on:
  push:
    branches: [ main, develop, copilot/* ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  lint:
    name: Run Android Lint
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: wrapper
          
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
        
      - name: Run Lint
        run: ./gradlew lint --no-daemon
        continue-on-error: true
        
      - name: Upload Lint Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lint-report
          path: app/build/reports/lint-results-*.html
          retention-days: 7
          
      - name: Lint Summary
        if: always()
        run: |
          echo "## Lint Check Status" >> $GITHUB_STEP_SUMMARY
          echo "Lint analysis completed for commit ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          if [ -f app/build/reports/lint-results-debug.txt ]; then
            echo "### Lint Results" >> $GITHUB_STEP_SUMMARY
            cat app/build/reports/lint-results-debug.txt >> $GITHUB_STEP_SUMMARY
          fi
