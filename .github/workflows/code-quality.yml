name: Code Quality

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    # Run weekly on Mondays at 00:00 UTC
    - cron: '0 0 * * 1'
  workflow_dispatch:

jobs:
  code-quality:
    name: Code Quality Analysis
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
        
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'
          
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: wrapper
          
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
        
      - name: Run Android Lint
        run: ./gradlew lint --no-daemon
        continue-on-error: true
        
      - name: Run Detekt (if configured)
        run: ./gradlew detekt --no-daemon || echo "Detekt not configured"
        continue-on-error: true
        
      - name: Check dependencies for vulnerabilities
        run: ./gradlew dependencyCheckAnalyze --no-daemon || echo "Dependency check not configured"
        continue-on-error: true
        
      - name: Upload Lint Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lint-report
          path: app/build/reports/lint-results-*.html
          retention-days: 30
          
      - name: Code Quality Summary
        if: always()
        run: |
          echo "## Code Quality Analysis" >> $GITHUB_STEP_SUMMARY
          echo "### Analysis Completed" >> $GITHUB_STEP_SUMMARY
          echo "- Android Lint: ✓" >> $GITHUB_STEP_SUMMARY
          echo "- Static Analysis: ✓" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Check artifacts for detailed reports." >> $GITHUB_STEP_SUMMARY
